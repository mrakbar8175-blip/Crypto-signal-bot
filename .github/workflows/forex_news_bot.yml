name: Simple Forex News Bot

on:
  # Run every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install feedparser requests  # <--- FIXED: Added 'requests' here
      
      - name: Post Forex News
        env:
          FOREX_WEBHOOK: ${{ secrets.FOREX_WEBHOOK }}
        run: python forex_news_bot.py